<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocupa · harness de verificação (não vai para produção)</title>
<link rel="stylesheet" href="../app/styles.css">
<style>
  #hns{position:fixed;right:0;bottom:0;z-index:999;background:#111;color:#fff;
    font:11px/1.5 system-ui;padding:6px 10px;display:flex;gap:8px;align-items:center}
  #hns button,#hns a{background:#333;color:#fff;border:0;padding:4px 8px;font:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="raiz" data-tema="claro"></div>
<div id="toasts"></div>
<div id="hns">
  <b>harness</b>
  <a href="?perfil=coordenador">coordenador</a>
  <a href="?perfil=professor">professor</a>
  <a href="?perfil=tecnico">técnico</a>
  <a href="?perfil=coordenador&denso=1">semana cheia</a>
  <button onclick="verFolha()">ver folha impressa</button>
  <span id="hns-log"></span>
</div>

<script src="../app/js/core.js"></script>
<script src="../app/js/config.js"></script>

<!-- No lugar de nuvem.js: mesma posição, mesma API. O store captura
     window.Nuvem por referência no topo da IIFE, então tudo abaixo é o
     código real de produção falando com um Firestore de mentira. -->
<script>
(function (global) {
  'use strict';
  var PERFIL = (/[?&]perfil=([a-z]+)/.exec(location.search) || [])[1] || 'coordenador';
  var CONTAS = {
    coordenador: { email: 'coord@teste.br', displayName: 'Andréa Coordenação' },
    professor: { email: 'prof@teste.br', displayName: 'Filipe Professor' },
    tecnico: { email: 'tec@teste.br', displayName: 'Murilo Técnico' }
  };
  var AUTORIZADOS = [
    { id: 'coord@teste.br', nome: 'Andréa Coordenação', nivel: 'coordenador', ativo: true },
    { id: 'prof@teste.br', nome: 'Filipe Professor', nivel: 'professor', ativo: true },
    { id: 'tec@teste.br', nome: 'Murilo Técnico', nivel: 'tecnico', ativo: true }
  ];
  var seq = 0;
  global.__escritas = [];
  global.__indices = {};

  function faixa(a, b) { var l = []; for (var n = a; n <= b; n++) l.push(n); return l; }

  /* O acervo mistura os DOIS modelos de propósito, porque produção também
     mistura: reserva gravada antes de 05/10/2026 aponta para TURMA e é
     integral (sem cadeirasPedidas/cadeirasAlocadas); a nova aponta para a
     disciplina e segura cadeiras contadas. E a pós tem "Implantodontia T1"
     e "T2" — a turma no nome que a limpeza do cadastro precisa juntar. */
  function acervo() {
    var C = global.Core, D = global.Dados;
    var s = D.semente();
    var hoje = C.hojeISO(), seg = C.startOfWeek(hoje);
    var disciplinas = [
      { id: 'd1', codigo: 'ODO-301', nome: 'Clínica Integrada I', nivel: 'graduacao', professores: ['prof@teste.br'] },
      /* Sem `nivel` nem `professores`: o estado de disciplina antiga — é
         graduação, e o professor vem da turma t2. */
      { id: 'd2', codigo: 'ODO-402', nome: 'Prótese Dentária' },
      { id: 'd3', codigo: 'POS-01', nome: 'Implantodontia T1', nivel: 'pos' },
      { id: 'd4', codigo: 'POS-02', nome: 'Implantodontia T2', nivel: 'pos', professores: ['prof@teste.br'] },
      { id: 'd5', codigo: 'POS-03', nome: 'Endodontia', nivel: 'pos', professores: [] }
    ];
    var turmas = [
      { id: 't1', disciplinaId: 'd1', codigo: 'T1', professorCoordenadorId: 'prof@teste.br', periodoLetivo: s.periodoLetivo },
      { id: 't2', disciplinaId: 'd2', codigo: 'T2', professorCoordenadorId: 'coord@teste.br', periodoLetivo: s.periodoLetivo },
      { id: 't3', disciplinaId: 'd3', codigo: 'PÓS', professorCoordenadorId: 'prof@teste.br', periodoLetivo: s.periodoLetivo }
    ];
    function rec(id, ag, esc, x) {
      var o = { id: id, tipo: 'recorrente', agrupamentoId: ag, escopo: esc,
        vigenciaInicio: s.semestre.inicio, vigenciaFim: s.semestre.fim, periodoLetivo: s.periodoLetivo,
        excecoes: [], criadoPor: 'coord@teste.br', criadoEm: C.carimbo() };
      Object.keys(x).forEach(function (k) { o[k] = x[k]; });
      return o;
    }
    function pont(id, ag, esc, x) {
      var o = { id: id, tipo: 'pontual', agrupamentoId: ag, escopo: esc, excecoes: [],
        criadoPor: 'coord@teste.br', criadoEm: C.carimbo() };
      Object.keys(x).forEach(function (k) { o[k] = x[k]; });
      return o;
    }
    var ocupacoes = [
      /* Legado: turma, sem quantidade — integral, segura a clínica inteira. */
      rec('r1', 'ag1', 'a', { turmaId: 't1', dias: [1, 3], inicio: '07:40', fim: '11:20' }),
      rec('r2', 'ag2', 'ambas', { turmaId: 't3', dias: [2], inicio: '18:20', fim: '22:00' }),
      /* Modelo novo: disciplina, professor, quantidade e cadeiras alocadas. */
      rec('r3', 'ag3', 'b', { disciplinaId: 'd2', responsavelId: 'coord@teste.br', tipoAtividade: 'graduacao',
        dias: [4, 5], inicio: '13:40', fim: '17:20', cadeirasPedidas: 8, cadeirasAlocadas: faixa(71, 78),
        descricao: 'T2 · prótese fixa' }),
      /* Duas reservas na MESMA pré-clínica e no mesmo horário: o que a
         reserva por quantidade passou a permitir. */
      rec('r4', 'ag5', 'a', { disciplinaId: 'd1', responsavelId: 'prof@teste.br', tipoAtividade: 'graduacao',
        dias: [1], inicio: '13:40', fim: '17:20', cadeirasPedidas: 30, cadeirasAlocadas: faixa(1, 30),
        descricao: 'T1 · laboratório' }),
      rec('r5', 'ag5', 'a', { disciplinaId: 'd4', responsavelId: 'prof@teste.br', tipoAtividade: 'pos',
        dias: [1], inicio: '13:40', fim: '17:20', cadeirasPedidas: 20, cadeirasAlocadas: faixa(31, 50),
        descricao: 'Turma da noite' }),
      pont('p1', 'ag4', 'a', { data: C.addDays(seg, 1), inicio: '13:40', fim: '17:20', tipoAtividade: 'graduacao',
        disciplinaId: 'd1', responsavelId: 'coord@teste.br', situacao: 'aprovada',
        cadeirasPedidas: 6, cadeirasAlocadas: faixa(85, 90), descricao: 'T1 · atendimento extra' }),
      pont('p2', 'ag4', 'b', { data: C.addDays(seg, 2), inicio: '07:40', fim: '11:20', tipoAtividade: 'pos',
        disciplinaId: 'd4', responsavelId: 'prof@teste.br', situacao: 'pendente', cadeirasPedidas: 10,
        descricao: 'T2 · cirurgia guiada', criadoPor: 'prof@teste.br' }),
      /* Pontual antiga: turma, tipo legado, integral. */
      pont('p3', 'ag1', 'b', { data: C.addDays(seg, 5), inicio: '07:40', fim: '11:20', tipoAtividade: 'reposicao',
        turmaId: 't1', responsavelId: 'coord@teste.br', situacao: 'aprovada', descricao: 'Reposição do feriado.' })
    ];

    /* ?denso=1 — a segunda-feira cheia. A grade da semana só mostra o que
       tem de errado (ou de certo) na largura das colunas quando um dia tem
       várias ocupações se cruzando no mesmo horário; com o acervo magro
       acima nenhuma coluna chega a disputar espaço, e o defeito relatado
       pela coordenação — cartões espremidos a ~35px — não aparece. */
    if (/[?&]denso=1/.test(location.search)) {
      var densas = [
        { ag: 'ag2', escopo: 'ambas', ini: '11:00', fim: '21:00', disc: 'd4', tipo: 'pos', cad: faixa(29, 36) },
        { ag: 'ag1', escopo: 'a', ini: '13:40', fim: '17:20', disc: 'd1', tipo: 'graduacao', cad: faixa(1, 4) },
        { ag: 'ag1', escopo: 'b', ini: '13:40', fim: '17:20', disc: 'd2', tipo: 'graduacao', cad: faixa(15, 18) },
        { ag: 'ag3', escopo: 'a', ini: '13:40', fim: '17:20', disc: 'd1', tipo: 'graduacao', cad: faixa(57, 60) },
        { ag: 'ag4', escopo: 'a', ini: '14:00', fim: '16:00', disc: 'd2', tipo: 'graduacao', cad: faixa(85, 88) },
        { ag: 'ag3', escopo: 'b', ini: '07:40', fim: '11:20', disc: 'd1', tipo: 'graduacao', cad: faixa(71, 74) },
        { ag: 'ag4', escopo: 'b', ini: '08:00', fim: '10:00', disc: 'd2', tipo: 'graduacao', cad: faixa(99, 102) }
      ];
      densas.forEach(function (x, k) {
        ocupacoes.push(pont('dn' + k, x.ag, x.escopo, {
          data: seg, inicio: x.ini, fim: x.fim, tipoAtividade: x.tipo,
          descricao: 'Semana cheia de verificação.', disciplinaId: x.disc,
          responsavelId: 'coord@teste.br', situacao: 'aprovada',
          cadeirasPedidas: x.cad.length, cadeirasAlocadas: x.cad
        }));
      });
    }

    /* O índice da transação nasce com o que o acervo reserva — aprovado e
       não excluído —, como o de produção. Vazio, a transação de mentira não
       veria choque nenhum com o acervo e esconderia justamente a classe de
       defeito que ela existe para pegar. */
    global.__indices = {};
    ocupacoes.forEach(function (o) {
      if (o.excluidaEm || (o.tipo === 'pontual' && o.situacao && o.situacao !== 'aprovada')) return;
      var l = global.__indices[o.agrupamentoId] || (global.__indices[o.agrupamentoId] = []);
      l.push({
        id: o.id, tipo: o.tipo, escopo: o.escopo, inicio: o.inicio, fim: o.fim,
        dias: o.dias || null, data: o.data || null,
        vigenciaInicio: o.vigenciaInicio || null, vigenciaFim: o.vigenciaFim || null,
        encerradaEm: o.encerradaEm || null, excecoes: [],
        cadeiras: o.cadeirasAlocadas ? o.cadeirasAlocadas.slice() : null
      });
    });

    return {
      config: { versao: s.versao, periodoLetivo: s.periodoLetivo, semestre: s.semestre, parametros: s.parametros },
      agrupamentos: s.agrupamentos, clinicas: s.clinicas, autorizados: AUTORIZADOS,
      disciplinas: disciplinas, turmas: turmas,
      alunos: [{ id: 'a1', nome: 'Ana Souza', matricula: '2021001', periodo: 8 },
               { id: 'a2', nome: 'Bruno Lima', matricula: '2021002', periodo: 8 }],
      ocupacoes: ocupacoes,
      manutencoes: [{ id: 'm1', protocolo: 'MAN-0001', clinicaId: 'cl1', cadeira: 3,
        categoria: 'equipamento', criticidade: 'alta', motivo: 'Refletor queimado',
        abertoPor: 'tec@teste.br', abertoEm: C.carimbo(), status: 'aberta', impacto: {} }],
      atribuicoes: [{ id: 'at1', chave: 'r:r1:' + C.addDays(seg, 0), clinicaId: 'cl1', cadeira: 1,
        nome: 'Ana Souza', alunoId: null, data: C.addDays(seg, 0),
        registradoPor: 'prof@teste.br', registradoEm: C.carimbo() }]
    };
  }

  function ok(v) { return global.Promise.resolve(v); }
  function log(m) { global.__escritas.push(m); var n = document.getElementById('hns-log'); if (n) n.textContent = m; }

  global.Nuvem = {
    iniciar: function () { return true; },
    disponivel: function () { return true; },
    COLECOES: [],
    entrarComGoogle: function () { return ok({ user: CONTAS[PERFIL] }); },
    sair: function () { return ok(); },
    aoMudarSessao: function (cb) { global.setTimeout(function () { cb(CONTAS[PERFIL]); }, 0); },
    contaAtual: function () { return CONTAS[PERFIL]; },
    lerAutorizado: function (email) {
      var a = null;
      AUTORIZADOS.forEach(function (x) { if (x.id === email) a = x; });
      return ok(a);
    },
    lerColecao: function () { return ok([]); },
    lerConfig: function () { return ok(acervo().config); },
    carregarTudo: function () { return ok(acervo()); },
    assinarVivas: function () { },
    encerrarAssinaturas: function () { },
    novoId: function (c) { return c + '_' + (++seq); },
    gravar: function (c, id, d) { log('gravar ' + c + '/' + id + ' ' + JSON.stringify(d).slice(0, 160)); return ok(id); },
    apagar: function (c, id) { log('apagar ' + c + '/' + id); return ok(); },
    apagarVarios: function (c, ids) { log('apagarVarios ' + c + ' ' + ids.length); return ok(); },
    /* Reproduz a transação: roda o validador contra o índice em memória e
       recusa igual ao Firestore quando há choque. */
    /* `validar` pode completar `dados` e `resumo` (as cadeiras escolhidas
       dentro da transação) — por isso o resumo é empurrado DEPOIS dele,
       como no `set` do Firestore. */
    gravarOcupacao: function (agId, id, dados, validar, resumo) {
      var itens = global.__indices[agId] || [];
      var choque = validar(itens);
      if (choque) return global.Promise.reject({ conflito: true, mensagem: choque });
      global.__indices[agId] = itens.filter(function (i) { return i.id !== id; }).concat([resumo]);
      log('gravarOcupacao ' + agId + '/' + id + ' · cadeiras ' + JSON.stringify(resumo.cadeiras) +
        ' · índice com ' + global.__indices[agId].length);
      return ok(id);
    },
    /* Estas três mexem no índice DE VERDADE. Enquanto eram no-op, o dublê
       escondia toda divergência entre o que a tela mostra e o que a transação
       valida — que é justamente a classe de defeito que o índice existe para
       criar. */
    removerOcupacao: function (agId, id) {
      global.__indices[agId] = (global.__indices[agId] || []).filter(function (i) { return i.id !== id; });
      log('removerOcupacao ' + agId + '/' + id + ' · índice com ' + global.__indices[agId].length);
      return ok(true);
    },
    desindexarOcupacao: function (agId, id) {
      global.__indices[agId] = (global.__indices[agId] || []).filter(function (i) { return i.id !== id; });
      log('desindexar ' + agId + '/' + id + ' · índice com ' + global.__indices[agId].length);
      return ok(id);
    },
    atualizarIndice: function (agId, id, resumo) {
      var itens = (global.__indices[agId] || []).filter(function (i) { return i.id !== id; });
      if (resumo) itens.push(resumo);
      global.__indices[agId] = itens;
      log('atualizarIndice ' + agId + '/' + id + ' · índice com ' + itens.length);
      return ok(true);
    }
  };

  /* A impressão real abriria o diálogo do sistema e travaria a verificação:
     aqui ela só marca que foi chamada, e o documento montado fica no DOM
     para ser inspecionado. */
  global.print = function () { log('window.print() chamado · documento montado no DOM'); };

  /* ?imprimir=semana|dia|recorrencias monta a folha e a deixa no DOM, sem
     abrir diálogo. Serve para gerar o PDF de verdade por fora:
       chrome --headless --print-to-pdf=saida.pdf "…harness.html?imprimir=semana"
     que é a única forma de conferir quebra de página e altura real da folha. */
  global.__autoImprimir = (/[?&]imprimir=([a-z]+)/.exec(location.search) || [])[1] || null;

  /* Troca o @media print para screen, para conferir a folha na tela com as
     regras de impressão de verdade — e não com uma cópia delas. */
  global.verFolha = function () {
    var achou = 0;
    for (var i = 0; i < document.styleSheets.length; i++) {
      var f = document.styleSheets[i];
      var regras;
      try { regras = f.cssRules; } catch (e) { continue; }
      for (var j = 0; j < regras.length; j++) {
        var r = regras[j];
        if (r.type === 4 && String(r.conditionText || r.media.mediaText).indexOf('print') !== -1) {
          r.media.mediaText = 'screen'; achou++;
        }
      }
    }
    log('regras @media print promovidas para screen: ' + achou);
  };
})(window);
</script>

<script src="../app/js/acesso.js"></script>
<script src="../app/js/dados.js"></script>
<script src="../app/js/store.js"></script>
<script src="../app/js/ui.js"></script>
<script src="../app/js/registro.js"></script>
<script src="../app/js/manutencao.js"></script>
<script src="../app/js/cadeiras.js"></script>
<script src="../app/js/impressao.js"></script>
<script src="../app/js/views/painel.js"></script>
<script src="../app/js/views/agora.js"></script>
<script src="../app/js/views/agenda.js"></script>
<script src="../app/js/views/disciplinas.js"></script>
<script src="../app/js/views/relatorios.js"></script>
<script src="../app/js/views/estrutura.js"></script>
<script src="../app/js/views/acessos.js"></script>
<script src="../app/js/app.js"></script>
<script>
/* Monta a folha pedida na URL assim que o acervo terminar de carregar. */
(function (global) {
  if (!global.__autoImprimir) return;
  var tentativas = 0;
  var relogio = setInterval(function () {
    if (++tentativas > 60) { clearInterval(relogio); return; }
    if (!global.Store || !global.Store.usuario() || !global.Store.estado.agrupamentos.length) return;
    clearInterval(relogio);
    var seg = global.Core.startOfWeek(global.Core.hojeISO());
    if (global.__autoImprimir === 'dia') global.Impressao.dia(global.Core.hojeISO());
    else if (global.__autoImprimir === 'recorrencias') global.Impressao.recorrencias();
    else if (global.__autoImprimir === 'disciplina') global.Impressao.disciplina('d1');
    else global.Impressao.semana(seg);
  }, 100);
})(window);
</script>
<script>
/* ?tela=agenda&vista=semana — abre a tela pedida assim que o acervo carrega.
   Existe para o Chrome headless, que só sabe carregar uma URL e fotografar:
   sem isto toda captura sai do Painel, e nenhuma vista além dele pode ser
   conferida fora da mão. */
(function (global) {
  var tela = (/[?&]tela=([a-z]+)/.exec(location.search) || [])[1];
  if (!tela) return;
  var vista = (/[?&]vista=([a-z]+)/.exec(location.search) || [])[1] || null;
  var tentativas = 0;
  var relogio = setInterval(function () {
    if (++tentativas > 60) { clearInterval(relogio); return; }
    if (!global.Store || !global.Store.usuario() || !global.Store.estado.agrupamentos.length) return;
    clearInterval(relogio);
    global.App.ir(tela, vista ? { vista: vista } : null);
  }, 100);
})(window);
</script>
</body>
